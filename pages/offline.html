<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Ligação - Flora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../assets/js/app.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-[#f2f7f4] min-h-screen flex justify-center items-center p-2">

  <div class="phone-frame w-full max-w-[390px] h-[820px] shadow-2xl flex flex-col overflow-hidden relative justify-center p-6 text-center space-y-4">
    
    <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-3xl flex items-center justify-center mx-auto shadow-md">
      <i data-lucide="wifi-off" class="w-8 h-8"></i>
    </div>

    <h2 class="text-xl font-extrabold text-slate-900">Sem ligação à Internet</h2>
    <p class="text-xs text-slate-500">
      Estás a navegar sem ligação à Internet. O teu histórico de tarefas guardado continuará acessível.
    </p>

    <button type="button" onclick="window.location.reload()" class="bg-[#1b4332] text-white font-bold py-2.5 px-6 rounded-2xl text-xs shadow-md mx-auto inline-flex items-center gap-2">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Tentar Novamente
    </button>

    <div id="screen-switcher" class="fixed top-3 right-3 z-50">
      <button type="button" onclick="toggleScreenMenu()" class="bg-[#1b4332] text-white p-2 rounded-xl shadow-lg flex items-center justify-center">
        <i data-lucide="layers" class="w-4 h-4"></i>
      </button>
      <div id="screen-menu" class="hidden absolute right-0 mt-2 w-44 bg-white rounded-2xl shadow-xl p-2 space-y-1 text-[11px] font-medium border border-slate-100">
        <a href="../index.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Início</a>
        <a href="offline.html" class="block px-2 py-1 rounded hover:bg-emerald-50 font-bold text-[#1b4332]">Sem ligação</a>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
    function toggleScreenMenu() { document.getElementById('screen-menu').classList.toggle('hidden'); }
  </script>
</body>
</html>
