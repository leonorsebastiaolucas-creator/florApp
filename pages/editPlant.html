<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Planta - Flora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../assets/js/app.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-[#f2f7f4] min-h-screen flex justify-center items-center p-2">

  <div class="phone-frame w-full max-w-[390px] h-[820px] shadow-2xl flex flex-col overflow-hidden relative justify-between">
    
    <header class="px-5 pt-4 pb-3 flex items-center justify-between glass-header sticky top-0 z-20">
      <button type="button" onclick="history.back()" class="w-8 h-8 rounded-xl bg-white/80 text-slate-700 flex items-center justify-center shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </button>
      <span class="text-sm font-bold text-slate-900">Editar planta</span>
      <div class="w-8"></div>
    </header>

    <div class="px-5 py-3 space-y-4 overflow-y-auto flex-1 no-scrollbar pb-24">
      
      <div class="relative h-40 rounded-2xl overflow-hidden soft-shadow">
        <img src="https://images.unsplash.com/photo-1614594975525-e45190c55d0b?auto=format&fit=crop&w=400&q=80" alt="Costela-de-Adão" class="w-full h-full object-cover">
        <button type="button" class="absolute bottom-2 right-2 bg-white/90 p-2 rounded-xl text-slate-800 shadow">
          <i data-lucide="camera" class="w-4 h-4"></i>
        </button>
      </div>

      <form class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">Nome da planta</label>
          <input type="text" value="Costela-de-Adão" class="w-full bg-white rounded-2xl px-3.5 py-2.5 text-xs border border-slate-200">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">Espécie</label>
          <input type="text" value="Monstera Deliciosa" class="w-full bg-white rounded-2xl px-3.5 py-2.5 text-xs border border-slate-200">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="window.location.href='plant.html'" class="flex-1 bg-[#1b4332] text-white font-bold py-3 rounded-2xl text-xs">
            Guardar Alterações
          </button>
          <button type="button" onclick="window.location.href='plants.html'" class="bg-red-50 text-red-600 font-bold px-4 py-3 rounded-2xl text-xs flex items-center justify-center">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>

    <div id="screen-switcher" class="fixed top-3 right-3 z-50">
      <button type="button" onclick="toggleScreenMenu()" class="bg-[#1b4332] text-white p-2 rounded-xl shadow-lg flex items-center justify-center">
        <i data-lucide="layers" class="w-4 h-4"></i>
      </button>
      <div id="screen-menu" class="hidden absolute right-0 mt-2 w-44 bg-white rounded-2xl shadow-xl p-2 space-y-1 text-[11px] font-medium border border-slate-100">
        <a href="../index.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Início</a>
        <a href="plants.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Catálogo</a>
        <a href="plant.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Detalhes</a>
        <a href="editPlant.html" class="block px-2 py-1 rounded hover:bg-emerald-50 font-bold text-[#1b4332]">Editar Planta</a>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
    function toggleScreenMenu() { document.getElementById('screen-menu').classList.toggle('hidden'); }
  </script>
</body>
</html>
