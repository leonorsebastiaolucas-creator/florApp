<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da Planta - FloraGest</title>
  <meta name="theme-color" content="#14532d">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/components/app-shell.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 0px;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex justify-center items-center p-2 text-slate-800">

  <!-- Frame do Telemóvel -->
  <div class="w-full max-w-[390px] bg-[#eef7ee] min-h-[820px] rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-[8px] border-slate-400/30">
    
    <!-- Top Bar Navigation -->
    <header class="px-4 pt-4 pb-2 flex items-center justify-between bg-[#eef7ee] sticky top-0 z-10">
      <button type="button" onclick="history.back()" class="w-9 h-9 rounded-full border border-dashed border-blue-400 flex items-center justify-center text-slate-700 bg-transparent">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center gap-1.5">
        <i data-lucide="sprout" class="w-4 h-4 text-emerald-700"></i>
        <h1 class="text-sm font-bold text-slate-800">Detalhes Da Planta</h1>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" class="text-slate-700">
          <i data-lucide="more-vertical" class="w-5 h-5"></i>
        </button>
        <div class="relative flex flex-col items-center">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="User" class="w-8 h-8 rounded-full object-cover">
          <span class="bg-blue-600 text-white text-[8px] font-bold px-1 rounded -bottom-2 absolute">Connected</span>
        </div>
      </div>
    </header>

    <!-- Conteúdo Scrollável -->
    <div class="px-5 py-2 space-y-4 overflow-y-auto flex-1 pb-20">

      <!-- Sub-header com Monitorização e Ações Rápidas de Favorito/Editar -->
      <div class="flex items-center justify-between">
        <span class="inline-flex items-center gap-1.5 bg-emerald-100/80 text-emerald-800 text-[11px] font-medium px-2.5 py-1 rounded-full">
          <span class="w-2 h-2 rounded-full bg-emerald-600"></span> Monitorização Ativa
        </span>
        <div class="flex items-center gap-2">
          <button type="button" class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-600 hover:text-red-500">
            <i data-lucide="heart" class="w-4 h-4"></i>
          </button>
          <button type="button" onclick="window.location.href='editPlant.html'" class="w-8 h-8 rounded-full border border-dashed border-blue-400 bg-white shadow-sm flex items-center justify-center text-slate-700">
            <i data-lucide="pencil" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Card da Imagem Principal com Badges -->
      <div class="relative rounded-3xl overflow-hidden shadow-sm border border-emerald-50 bg-white">
        <img src="https://images.unsplash.com/photo-1509423350716-97f9360b4e09?auto=format&fit=crop&w=600&q=80" alt="Cacto da Sala" class="w-full h-56 object-cover">
        
        <!-- Badges Flutuantes -->
        <div class="absolute top-3 left-3 flex flex-wrap gap-1.5 max-w-[85%]">
          <span class="bg-white/90 backdrop-blur text-slate-800 text-[10px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Saudável 🌱
          </span>
          <span class="bg-white/90 backdrop-blur text-slate-800 text-[10px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
            <i data-lucide="armchair" class="w-3 h-3 text-slate-500"></i> Sala de estar
          </span>
          <span class="bg-white/90 backdrop-blur text-slate-800 text-[10px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
            <i data-lucide="sun" class="w-3 h-3 text-amber-500"></i> Sol Pleno ☀️
          </span>
        </div>

        <!-- Informações do Nome e Adoção -->
        <div class="p-4 flex items-start justify-between bg-white">
          <div>
            <h2 class="text-xl font-bold text-slate-900 leading-tight">Cacto da Sala</h2>
            <p class="text-xs text-slate-500 italic mt-0.5">Cactaceae • Espécime Doméstico</p>
          </div>
          <span class="bg-emerald-50 text-emerald-800 text-[10px] font-medium px-2.5 py-1 rounded-xl text-center leading-tight">
            Adotado há 8<br>meses
          </span>
        </div>
      </div>

      <!-- Cards de Indicadores de Cuidados (Rega, Luz, Humidade) -->
      <div class="grid grid-cols-3 gap-2">
        <!-- Rega -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-emerald-50 text-center flex flex-col items-center justify-center">
          <div class="relative w-10 h-10 flex items-center justify-center mb-1">
            <svg class="w-10 h-10 transform -rotate-90" viewBox="0 0 36 36">
              <path class="text-emerald-100" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
              <path class="text-emerald-700" stroke-dasharray="65, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <i data-lucide="droplets" class="w-4 h-4 text-emerald-800 absolute"></i>
          </div>
          <span class="text-[10px] text-slate-400">Rega</span>
          <span class="text-xs font-bold text-slate-800">Faltam 5d</span>
        </div>

        <!-- Luz Solar -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-emerald-50 text-center flex flex-col items-center justify-center">
          <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center mb-1 text-orange-500">
            <i data-lucide="sun" class="w-5 h-5"></i>
          </div>
          <span class="text-[10px] text-slate-400">Luz solar</span>
          <span class="text-xs font-bold text-slate-800">Direta</span>
        </div>

        <!-- Humidade -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-emerald-50 text-center flex flex-col items-center justify-center">
          <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center mb-1 text-teal-600">
            <i data-lucide="wind" class="w-5 h-5"></i>
          </div>
          <span class="text-[10px] text-slate-400">Humidade</span>
          <span class="text-xs font-bold text-slate-800">20-30%</span>
        </div>
      </div>

      <!-- Secção de Ações Rápidas -->
      <div class="space-y-2 pt-1">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-bold text-slate-800">Ações Rápidas</h3>
          <span class="text-[10px] text-slate-400">Toque para registar</span>
        </div>

        <div class="grid grid-cols-4 gap-2">
          <!-- Regar -->
          <button type="button" class="bg-white p-2.5 rounded-2xl shadow-sm border border-emerald-50 flex flex-col items-center justify-center gap-1 hover:bg-emerald-50/50">
            <div class="w-9 h-9 rounded-full bg-[#14532d] text-white flex items-center justify-center shadow-sm">
              <i data-lucide="droplet" class="w-4 h-4"></i>
            </div>
            <span class="text-[11px] font-medium text-slate-700">Regar</span>
          </button>

          <!-- Adubar -->
          <button type="button" class="bg-white p-2.5 rounded-2xl shadow-sm border border-emerald-50 flex flex-col items-center justify-center gap-1 hover:bg-emerald-50/50">
            <div class="w-9 h-9 rounded-full bg-emerald-200 text-emerald-900 flex items-center justify-center">
              <i data-lucide="sprout" class="w-4 h-4"></i>
            </div>
            <span class="text-[11px] font-medium text-slate-700">Adubar</span>
          </button>

          <!-- Foto -->
          <button type="button" class="bg-white p-2.5 rounded-2xl shadow-sm border border-emerald-50 flex flex-col items-center justify-center gap-1 hover:bg-emerald-50/50" onclick="window.location.href='editPlant.html'">
            <div class="w-9 h-9 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center">
              <i data-lucide="camera" class="w-4 h-4"></i>
            </div>
            <span class="text-[11px] font-medium text-slate-700">Foto</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
