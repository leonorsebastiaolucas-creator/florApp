<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Planta - Flora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../assets/js/app.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-[#f2f7f4] min-h-screen flex justify-center items-center p-2">

  <div class="phone-frame w-full max-w-[390px] h-[820px] shadow-2xl flex flex-col overflow-hidden relative justify-between">
    
    <header class="px-5 pt-4 pb-3 flex items-center justify-between glass-header sticky top-0 z-20">
      <button type="button" onclick="history.back()" class="w-8 h-8 rounded-xl bg-white/80 text-slate-700 flex items-center justify-center shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </button>
      <span class="text-sm font-bold text-slate-900">Nova planta</span>
      <div class="w-8"></div>
    </header>

    <div class="px-5 py-3 space-y-4 overflow-y-auto flex-1 no-scrollbar pb-24">
      
      <!-- Carregamento de fotografia -->
      <div class="glass-card rounded-3xl p-6 text-center space-y-2 border-2 border-dashed border-emerald-900/20 soft-shadow">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-[#1b4332] flex items-center justify-center mx-auto">
          <i data-lucide="camera" class="w-6 h-6"></i>
        </div>
        <p class="text-xs font-bold text-slate-800">Adicionar fotografia</p>
        <p class="text-[10px] text-slate-400">Tira uma fotografia ou escolhe uma imagem da galeria</p>
      </div>

      <form id="plant-form" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1 flex items-center gap-1.5">
            <i data-lucide="tag" class="w-3.5 h-3.5 text-[#2d6a4f]"></i> Nome da planta
          </label>
          <input type="text" name="name" required maxlength="60" placeholder="Ex.: Costela-de-Adão da sala" class="w-full bg-white rounded-2xl px-3.5 py-2.5 text-xs text-slate-700 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1b4332]">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1 flex items-center gap-1.5">
            <i data-lucide="sprout" class="w-3.5 h-3.5 text-[#2d6a4f]"></i> Espécie científica
          </label>
          <input type="text" name="species" maxlength="60" placeholder="Ex.: Monstera deliciosa" class="w-full bg-white rounded-2xl px-3.5 py-2.5 text-xs text-slate-700 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1b4332]">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1 flex items-center gap-1.5">
              <i data-lucide="droplet" class="w-3.5 h-3.5 text-[#2d6a4f]"></i> Rega (dias)
            </label>
            <input type="number" name="wateringDays" min="1" max="365" placeholder="7" class="w-full bg-white rounded-2xl px-3.5 py-2.5 text-xs text-slate-700 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1b4332]">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1 flex items-center gap-1.5">
              <i data-lucide="sun" class="w-3.5 h-3.5 text-[#2d6a4f]"></i> Exposição
            </label>
            <select name="light" class="w-full bg-white rounded-2xl px-3.5 py-2.5 text-xs text-slate-700 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1b4332]">
              <option>Luz indireta</option>
              <option>Sol direto</option>
              <option>Sombra</option>
            </select>
          </div>
        </div>

        <div>
          <label for="plant-photo" class="block text-[11px] font-bold text-slate-700 mb-1">Fotografia (opcional)</label>
          <input id="plant-photo" type="file" name="photo" accept="image/*" class="w-full bg-white rounded-xl px-3 py-2 text-xs border border-slate-200">
        </div>

        <p id="plant-message" role="status" aria-live="polite" class="text-xs text-red-700"></p>
        <button type="submit" class="w-full bg-[#1b4332] text-white font-bold py-3 rounded-2xl shadow-lg shadow-[#1b4332]/20 flex items-center justify-center gap-2 mt-4">
          <i data-lucide="check" class="w-4 h-4"></i> Guardar Planta
        </button>
      </form>
    </div>

    <!-- Screen Switcher -->
    <div id="screen-switcher" class="fixed top-3 right-3 z-50">
      <button type="button" onclick="toggleScreenMenu()" class="bg-[#1b4332] text-white p-2 rounded-xl shadow-lg flex items-center justify-center">
        <i data-lucide="layers" class="w-4 h-4"></i>
      </button>
      <div id="screen-menu" class="hidden absolute right-0 mt-2 w-44 bg-white rounded-2xl shadow-xl p-2 space-y-1 text-[11px] font-medium border border-slate-100">
        <a href="../index.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Início</a>
        <a href="plants.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Catálogo</a>
        <a href="addPlant.html" class="block px-2 py-1 rounded hover:bg-emerald-50 font-bold text-[#1b4332]">Adicionar Planta</a>
        <a href="editPlant.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Editar Planta</a>
        <a href="tasks.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Tarefas</a>
        <a href="profile.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Perfil</a>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
    function toggleScreenMenu() { document.getElementById('screen-menu').classList.toggle('hidden'); }
  </script>
</body>
</html>
