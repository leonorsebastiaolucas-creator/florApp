<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Planta - FloraGest</title>
  <meta name="theme-color" content="#14532d">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/components/app-shell.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 0px;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex justify-center items-center p-2 text-slate-800">

  <!-- Frame de Telemóvel Mobile -->
  <div class="w-full max-w-[390px] bg-[#eef7ee] min-h-[820px] rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-[8px] border-slate-400/30">
    
    <!-- Top Bar Navigation -->
    <header class="px-4 pt-4 pb-2 flex items-center justify-between bg-[#eef7ee] sticky top-0 z-10">
      <button type="button" onclick="history.back()" class="w-9 h-9 rounded-full border border-dashed border-blue-400 flex items-center justify-center text-slate-700 bg-transparent">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center gap-1.5">
        <i data-lucide="sprout" class="w-4 h-4 text-emerald-700"></i>
        <h1 class="text-sm font-bold text-slate-800">Adicionar Planta</h1>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" class="text-slate-700">
          <i data-lucide="more-vertical" class="w-5 h-5"></i>
        </button>
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="User" class="w-8 h-8 rounded-full object-cover">
      </div>
    </header>

    <!-- Conteúdo Scrollável -->
    <div class="px-5 py-3 space-y-4 overflow-y-auto flex-1 pb-24">

      <!-- Badge & Título -->
      <div>
        <span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
          <i data-lucide="leaf" class="w-3 h-3"></i> NOVO CULTIVO
        </span>
        <h2 class="text-xl font-bold text-slate-900 mt-1">Nova Planta</h2>
        <p class="text-xs text-slate-500">Adiciona uma companheira verde à tua coleção.</p>
      </div>

      <!-- Área para Carregar / Tirar Foto -->
      <div onclick="document.getElementById('photo-input').click()" class="bg-white rounded-2xl p-6 text-center shadow-sm border border-emerald-50 cursor-pointer flex flex-col items-center justify-center hover:bg-emerald-50/40 transition">
        <div class="w-12 h-12 rounded-full bg-emerald-100/70 text-emerald-800 flex items-center justify-center mb-2">
          <i data-lucide="camera" class="w-6 h-6"></i>
        </div>
        <h3 class="text-sm font-bold text-slate-800">Tirar foto ou escolher da galeria</h3>
        <p class="text-[11px] text-slate-400 mt-0.5">Regista o primeiro dia da tua muda</p>
        <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="previewPhoto(event)">
      </div>

      <!-- Card do Formulário Secundário -->
      <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3.5 border border-emerald-50">
        
        <!-- Nome ou Alcunha -->
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">
            Nome ou alcunha <span class="text-teal-500">•</span>
          </label>
          <div class="relative">
            <input type="text" id="plant-nickname" placeholder="ex: O meu Cacto da sala, Sofia..." class="w-full bg-[#eef7ee]/60 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none pr-9">
            <i data-lucide="flower-2" class="w-4 h-4 text-slate-300 absolute right-3 top-3"></i>
          </div>
        </div>

        <!-- Tipo de Planta -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-slate-700">Tipo de Planta</label>
            <span class="text-[10px] text-slate-400">Sugestões rápidas</span>
          </div>
          <div class="relative mb-2">
            <input type="text" placeholder="Pesquisar ou escolher abaixo..." class="w-full bg-[#eef7ee]/60 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none pr-9">
            <i data-lucide="sprout" class="w-4 h-4 text-slate-300 absolute right-3 top-3"></i>
          </div>

          <!-- Chips de Sugestão -->
          <div class="flex flex-wrap gap-1.5" id="species-group">
            <button type="button" onclick="toggleChip(this)" class="px-3 py-1 rounded-full text-[11px] bg-slate-100 text-slate-600">Cacto</button>
            <button type="button" onclick="toggleChip(this)" class="px-3 py-1 rounded-full text-[11px] bg-slate-100 text-slate-600">Suculenta</button>
            <button type="button" onclick="toggleChip(this)" class="px-3 py-1 rounded-full text-[11px] bg-slate-100 text-slate-600">Espada-de-são-jorge</button>
            <button type="button" onclick="toggleChip(this)" class="px-3 py-1 rounded-full text-[11px] bg-[#2d6a4f] text-white font-semibold">Jibóia</button>
            <button type="button" onclick="toggleChip(this)" class="px-3 py-1 rounded-full text-[11px] bg-slate-100 text-slate-600">Samambaia</button>
            <button type="button" onclick="toggleChip(this)" class="px-3 py-1 rounded-full text-[11px] bg-slate-100 text-slate-600">Ficus</button>
            <button type="button" onclick="toggleChip(this)" class="px-3 py-1 rounded-full text-[11px] bg-slate-100 text-slate-600">Lavanda</button>
          </div>
        </div>

        <!-- Localização / Divisão -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-slate-700">Localização / Divisão</label>
            <span class="text-[10px] text-slate-400">Onde ela vai morar?</span>
          </div>
          <div class="relative">
            <select class="w-full bg-[#eef7ee]/60 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 appearance-none focus:outline-none">
              <option>Sala de estar</option>
              <option>Varanda</option>
              <option>Quarto</option>
              <option>Cozinha</option>
              <option>Escritório</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 absolute right-3 top-3 pointer-events-none"></i>
          </div>
        </div>

      </div>

      <!-- Secção de Plano de Cuidados -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-emerald-50">
        <h3 class="text-sm font-bold text-slate-800">Plano de Cuidados</h3>
        <p class="text-xs text-slate-400">Define os lembretes de rega e luz</p>
      </div>

    </div>

    <!-- Botão Fixo de Guardar Planta -->
    <div class="absolute bottom-4 left-4 right-4 z-20">
      <div class="relative flex flex-col items-center">
        <span class="bg-blue-600 text-white text-[9px] font-bold px-1.5 py-0.2 rounded mb-1 self-start">Connected</span>
        <button type="button" onclick="savePlant()" class="w-full bg-[#2d6a4f] hover:bg-emerald-900 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 border border-dashed border-blue-400">
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
          Guardar Planta
        </button>
      </div>
    </div>

    <!-- Ícone Lápis Flutuante Inferior -->
    <div class="absolute -bottom-5 left-0 right-0 flex justify-center pointer-events-none z-30">
      <div class="bg-slate-300 w-10 h-10 rounded-full flex items-center justify-center shadow-md border border-slate-400">
        <i data-lucide="pencil" class="w-4 h-4 text-slate-800"></i>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        alert("Fotografia selecionada com sucesso!");
      }
    }

    function toggleChip(button) {
      const container = document.getElementById('species-group');
      const buttons = container.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.className = "px-3 py-1 rounded-full text-[11px] bg-slate-100 text-slate-600";
      });
      button.className = "px-3 py-1 rounded-full text-[11px] bg-[#2d6a4f] text-white font-semibold";
    }

    function savePlant() {
      alert("Planta guardada com sucesso!");
    }
  </script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
