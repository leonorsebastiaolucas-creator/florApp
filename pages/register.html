<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Flora BOTÂNICA</title>
  <meta name="theme-color" content="#14532d">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/components/app-shell.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 0px;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex justify-center items-center p-2 text-slate-800">

  <!-- Frame do Telemóvel -->
  <div class="w-full max-w-[390px] bg-[#eef7ee] min-h-[820px] rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-[8px] border-slate-400/30">
    
    <!-- Top Bar Navigation -->
    <header class="px-5 pt-5 pb-2 flex items-center justify-between bg-[#eef7ee] sticky top-0 z-10">
      <div class="flex items-center gap-2 bg-emerald-100/60 px-3 py-1 rounded-full">
        <i data-lucide="sprout" class="w-4 h-4 text-emerald-800"></i>
        <span class="text-xs font-bold text-emerald-900 tracking-wider">FLORA BOTÂNICA</span>
      </div>

      <button type="button" class="w-8 h-8 rounded-full bg-emerald-100/60 flex items-center justify-center text-emerald-800">
        <i data-lucide="leaf" class="w-4 h-4"></i>
      </button>
    </header>

    <!-- Conteúdo Scrollável -->
    <div class="px-5 py-3 space-y-4 overflow-y-auto flex-1 pb-16">

      <!-- Ícone e Título da Página -->
      <div class="space-y-1">
        <div class="w-9 h-9 rounded-full bg-emerald-100/80 flex items-center justify-center text-emerald-800 mb-2">
          <i data-lucide="flower-2" class="w-5 h-5"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 leading-tight">Criar Conta</h1>
        <p class="text-xs text-slate-600 leading-relaxed">
          Junte-se à comunidade Flora e cuide das suas plantas com carinho e tranquilidade.
        </p>
      </div>

      <!-- Card do Formulário de Registo -->
      <div class="bg-white rounded-3xl p-5 shadow-sm space-y-3.5 border border-emerald-50">
        
        <form id="register-form" class="space-y-3.5">
          
          <!-- Nome Completo -->
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1 flex items-center gap-1.5">
              <i data-lucide="user" class="w-3.5 h-3.5 text-slate-500"></i> Nome completo
            </label>
            <input type="text" id="full-name" placeholder="Maria Santos" required class="w-full bg-[#eef7ee]/60 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-500">
          </div>

          <!-- Correio Eletrónico -->
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1 flex items-center gap-1.5">
              <i data-lucide="mail" class="w-3.5 h-3.5 text-slate-500"></i> Correio eletrónico
            </label>
            <input type="email" id="email" placeholder="maria@exemplo.pt" required class="w-full bg-[#eef7ee]/60 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-500">
          </div>

          <!-- Palavra-passe -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-[11px] font-bold text-slate-700 flex items-center gap-1.5">
                <i data-lucide="lock" class="w-3.5 h-3.5 text-slate-500"></i> Palavra-passe
              </label>
              <span class="text-[10px] text-slate-400">Mínimo de 8 carateres</span>
            </div>
            <div class="relative">
              <input type="password" id="password" minlength="8" placeholder="••••••••" required class="w-full bg-[#eef7ee]/60 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-500">
            </div>
          </div>
          <button type="submit" class="w-full rounded-xl bg-[#2d6a4f] px-4 py-3 text-sm font-bold text-white">
            Criar conta
          </button>
        </form>
      </div>
      <p id="register-message" class="text-xs text-center text-slate-600" role="status" aria-live="polite"></p>
      <p class="text-center text-xs text-slate-600">
        Já tens conta? <a class="font-semibold text-emerald-800" href="login.html">Inicia sessão</a>
      </p>
    </div>
  </div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
