<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas e lembretes - Flora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../assets/js/app.js"></script>
  <script type="module" src="../assets/js/modules/notes.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-[#f2f7f4] min-h-screen flex justify-center items-center p-2">
  <main class="phone-frame w-full max-w-[390px] h-[820px] shadow-2xl flex flex-col overflow-hidden relative justify-between">
    <header class="px-5 pt-4 pb-3 flex items-center gap-3 glass-header sticky top-0 z-20">
      <a href="../index.html" aria-label="Voltar ao início" class="w-9 h-9 rounded-xl bg-white/80 text-slate-700 flex items-center justify-center shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4" aria-hidden="true"></i>
      </a>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center">
          <i data-lucide="notebook-pen" class="w-4 h-4" aria-hidden="true"></i>
        </div>
        <h1 class="text-base font-extrabold text-[#1b4332]">Notas e lembretes</h1>
      </div>
    </header>

    <div class="px-5 py-5 space-y-5 overflow-y-auto flex-1 no-scrollbar">
      <section aria-labelledby="notes-intro">
        <h2 id="notes-intro" class="text-xl font-bold text-slate-900">O teu espaço pessoal</h2>
        <p class="text-sm text-slate-500 mt-1">Guarda ideias, lembretes e tarefas. Ficam arquivados neste dispositivo.</p>
      </section>

      <form id="note-form" class="glass-card rounded-2xl p-4 soft-shadow space-y-3">
        <div>
          <label for="note-type" class="block text-xs font-bold text-slate-700 mb-1">Tipo</label>
          <select id="note-type" name="type" class="w-full px-3 py-2.5 text-sm">
            <option value="note">Nota</option>
            <option value="reminder">Lembrete</option>
            <option value="task">Tarefa</option>
          </select>
        </div>
        <div>
          <label for="note-content" class="block text-xs font-bold text-slate-700 mb-1">O que queres guardar?</label>
          <textarea id="note-content" name="content" required maxlength="2000" rows="4" placeholder="Escreve aqui..." class="w-full rounded-xl border border-emerald-900/10 px-3 py-2.5 text-sm resize-y"></textarea>
        </div>
        <div>
          <label for="note-date" class="block text-xs font-bold text-slate-700 mb-1">Data (opcional)</label>
          <input id="note-date" name="date" type="date" class="w-full px-3 py-2.5 text-sm">
        </div>
        <p id="note-message" role="status" aria-live="polite" class="text-sm text-rose-700"></p>
        <button type="submit" class="w-full rounded-xl bg-[#1b4332] text-white font-bold px-4 py-3 flex items-center justify-center gap-2 hover:bg-[#2d6a4f]">
          <i data-lucide="save" class="w-4 h-4" aria-hidden="true"></i>
          Guardar no arquivo
        </button>
      </form>

      <section aria-labelledby="archive-title" class="space-y-3">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 id="archive-title" class="text-lg font-bold text-slate-900">O meu arquivo</h2>
            <p id="note-count" class="text-xs text-slate-500"></p>
          </div>
          <label for="note-filter" class="sr-only">Filtrar arquivo</label>
          <select id="note-filter" class="max-w-36 px-2 py-2 text-xs">
            <option value="all">Tudo</option>
            <option value="note">Notas</option>
            <option value="reminder">Lembretes</option>
            <option value="task">Tarefas</option>
          </select>
        </div>
        <p id="note-empty" class="rounded-2xl bg-white/70 px-4 py-8 text-center text-sm text-slate-500">
          Ainda não guardaste nada. Usa o formulário acima para começar.
        </p>
        <div id="note-list" class="space-y-3" aria-live="polite"></div>
      </section>
    </div>
  </main>
</body>
</html>
