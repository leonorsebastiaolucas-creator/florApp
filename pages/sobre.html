<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre - Flora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../assets/js/app.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-[#f2f7f4] min-h-screen flex justify-center items-center p-2">

  <div class="phone-frame w-full max-w-[390px] h-[820px] shadow-2xl flex flex-col overflow-hidden relative justify-between">
    
    <header class="px-5 pt-4 pb-3 flex items-center justify-between glass-header sticky top-0 z-20">
      <button type="button" onclick="history.back()" class="w-8 h-8 rounded-xl bg-white/80 text-slate-700 flex items-center justify-center shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </button>
      <span class="text-sm font-bold text-slate-900">Sobre</span>
      <div class="w-8"></div>
    </header>

    <div class="px-5 py-6 text-center space-y-4 flex-1">
      <div class="w-16 h-16 bg-[#1b4332] text-white rounded-3xl flex items-center justify-center mx-auto shadow-xl">
        <i data-lucide="sprout" class="w-8 h-8"></i>
      </div>
      <h2 class="text-xl font-black text-slate-900">Flora PWA</h2>
      <p class="text-xs text-slate-500 leading-relaxed px-4">
        Aplicação Web Progressiva desenhada para auxiliar no cuidado diário de plantas de interior e jardim.
      </p>
      <div class="glass-card p-4 rounded-2xl text-left text-xs space-y-2">
        <p class="font-bold text-slate-800">Versão: 1.0.0</p>
        <p class="text-slate-500">Desenvolvido em HTML, Tailwind CSS e JavaScript.</p>
      </div>
    </div>

    <div id="screen-switcher" class="fixed top-3 right-3 z-50">
      <button type="button" onclick="toggleScreenMenu()" class="bg-[#1b4332] text-white p-2 rounded-xl shadow-lg flex items-center justify-center">
        <i data-lucide="layers" class="w-4 h-4"></i>
      </button>
      <div id="screen-menu" class="hidden absolute right-0 mt-2 w-44 bg-white rounded-2xl shadow-xl p-2 space-y-1 text-[11px] font-medium border border-slate-100">
        <a href="../index.html" class="block px-2 py-1 rounded hover:bg-emerald-50">Início</a>
        <a href="sobre.html" class="block px-2 py-1 rounded hover:bg-emerald-50 font-bold text-[#1b4332]">Sobre</a>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
    function toggleScreenMenu() { document.getElementById('screen-menu').classList.toggle('hidden'); }
  </script>
</body>
</html>
