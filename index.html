<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#244b3b">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Catálogo de Plantas - Flora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="assets/js/app.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#f2f7f4] min-h-screen flex justify-center items-center p-2">

  <div class="phone-frame w-full max-w-[390px] h-[820px] shadow-2xl flex flex-col overflow-hidden relative justify-between">
    
    <!-- Top Bar -->
    <header class="px-5 pt-4 pb-3 flex items-center justify-between glass-header sticky top-0 z-20">
      <div class="flex items-center gap-2">
        <div class="brand-logo w-8 h-8 rounded-xl bg-[#1b4332] text-white flex items-center justify-center shadow-md">
          <i data-lucide="sprout" class="w-4 h-4"></i>
        </div>
        <span class="text-base font-extrabold text-[#1b4332] tracking-tight">Flora</span>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" aria-label="Abrir notas e lembretes" title="Notas e lembretes" onclick="window.location.href='pages/notes.html'" class="w-8 h-8 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center shadow-sm">
          <i data-lucide="notebook-pen" class="w-4 h-4"></i>
        </button>
        <button type="button" aria-label="Adicionar planta" onclick="window.location.href='pages/addPlant.html'" class="w-8 h-8 rounded-xl bg-[#1b4332] text-white flex items-center justify-center shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Conteúdo Scrollável -->
    <div class="px-5 py-3 space-y-4 overflow-y-auto flex-1 no-scrollbar pb-24">

      <div>
        <h2 class="text-xl font-bold text-slate-900">Catálogo de Plantas</h2>
        <p class="text-xs text-slate-500 mt-0.5">Explora as espécies e adiciona as tuas plantas à coleção.</p>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
        <input id="plant-search" type="search" placeholder="Pesquisar por nome ou espécie..." aria-label="Pesquisar plantas por nome ou espécie" class="w-full bg-white/90 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-slate-700 placeholder-slate-400 border border-emerald-900/10 focus:outline-none focus:ring-2 focus:ring-[#1b4332]">
      </div>

      <div id="plant-grid" class="grid grid-cols-2 gap-3">
        <article data-plant-name data-catalog-plant data-catalog-id="limoeiro" data-watering-days="7" data-light="Sol direto" data-care="Precisa de bastante luz e de um vaso com boa drenagem." class="glass-card rounded-2xl overflow-hidden soft-shadow group">
          <div class="h-32">
            <img src="https://i.pinimg.com/originals/6d/04/f7/6d04f724c9864acedd241e44835b1838.jpg" alt="Limoeiro" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
          </div>
          <div class="p-3">
            <h4 class="text-xs font-bold text-slate-800 truncate">Limoeiro</h4>
            <p class="text-[10px] text-slate-400 italic">Citrus limon</p>
            <button type="button" data-save-catalog-plant class="mt-3 w-full rounded-xl bg-[#1b4332] px-3 py-2 text-[10px] font-bold text-white hover:bg-[#2d6a4f] disabled:cursor-default disabled:bg-emerald-100 disabled:text-emerald-900">Guardar</button>
            <p data-save-message role="status" aria-live="polite" class="mt-1 text-[10px] text-red-700"></p>
          </div>
        </article>
        <article data-plant-name data-catalog-plant data-catalog-id="alfazema" data-watering-days="7" data-light="Sol direto" data-care="Gosta de sol direto e de solo bem drenado; evita encharcar a terra." class="glass-card rounded-2xl overflow-hidden soft-shadow group">
          <div class="h-32">
            <img src="https://i.pinimg.com/originals/59/bd/fa/59bdfa3d93b5ef0831907378cf1fe4a1.jpg" alt="Alfazema" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
          </div>
          <div class="p-3">
            <h4 class="text-xs font-bold text-slate-800 truncate">Alfazema</h4>
            <p class="text-[10px] text-slate-400 italic">Lavandula angustifolia</p>
            <button type="button" data-save-catalog-plant class="mt-3 w-full rounded-xl bg-[#1b4332] px-3 py-2 text-[10px] font-bold text-white hover:bg-[#2d6a4f] disabled:cursor-default disabled:bg-emerald-100 disabled:text-emerald-900">Guardar</button>
            <p data-save-message role="status" aria-live="polite" class="mt-1 text-[10px] text-red-700"></p>
          </div>
        </article>
        <article data-plant-name data-catalog-plant data-catalog-id="hortela" data-watering-days="3" data-light="Luz indireta" data-care="Mantém a terra ligeiramente húmida e poda regularmente para estimular o crescimento." class="glass-card rounded-2xl overflow-hidden soft-shadow group">
          <div class="h-32">
            <img src="https://i.pinimg.com/originals/63/60/68/6360684ee640d6b90998765d10058806.jpg" alt="Hortelã" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
          </div>
          <div class="p-3">
            <h4 class="text-xs font-bold text-slate-800 truncate">Hortelã</h4>
            <p class="text-[10px] text-slate-400 italic">Mentha spicata</p>
            <button type="button" data-save-catalog-plant class="mt-3 w-full rounded-xl bg-[#1b4332] px-3 py-2 text-[10px] font-bold text-white hover:bg-[#2d6a4f] disabled:cursor-default disabled:bg-emerald-100 disabled:text-emerald-900">Guardar</button>
            <p data-save-message role="status" aria-live="polite" class="mt-1 text-[10px] text-red-700"></p>
          </div>
        </article>
      </div>

    </div>

    <!-- Navegação Inferior -->
    <nav class="bg-white/90 backdrop-blur-md border-t border-emerald-900/10 px-4 py-2.5 flex justify-around items-center sticky bottom-0 z-20">
      <button type="button" class="flex flex-col items-center gap-0.5 text-[#1b4332] font-bold">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[9px]">Catálogo</span>
      </button>

      <button type="button" onclick="window.location.href='pages/plants.html'" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-[#1b4332]">
        <i data-lucide="sprout" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium">Guardadas</span>
      </button>

      <button type="button" onclick="window.location.href='pages/addPlant.html'" class="w-11 h-11 bg-[#1b4332] text-white rounded-2xl flex items-center justify-center shadow-lg shadow-[#1b4332]/30 -mt-5 hover:bg-[#2d6a4f] transition">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </button>

      <button type="button" onclick="window.location.href='pages/tasks.html'" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-[#1b4332]">
        <i data-lucide="check-square" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium">Tarefas</span>
      </button>

      <button type="button" onclick="window.location.href='pages/profile.html'" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-[#1b4332]">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium">Perfil</span>
      </button>
    </nav>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
